<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <title>Dükkânın vitrini</title>
  <defs>
    <linearGradient id="plaster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEDCC2"/>
      <stop offset="1" stop-color="#E3CBA9"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8DFAF"/>
      <stop offset="1" stop-color="#E7B576"/>
    </linearGradient>
    <pattern id="stripes" width="46" height="60" patternUnits="userSpaceOnUse">
      <rect width="23" height="60" fill="#C4623A"/>
      <rect x="23" width="23" height="60" fill="#F5E8D5"/>
    </pattern>
    <pattern id="tiles" width="30" height="16" patternUnits="userSpaceOnUse">
      <rect width="30" height="16" fill="#9E5636"/>
      <path d="M0 15.5h30M15 0v8M0 8h30M29.5 8v8" stroke="#87452A" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="url(#plaster)"/>

