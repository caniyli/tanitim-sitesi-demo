    <path d="M-20 44h132c8 0 12 4 12 10H-20z" fill="#3B3734"/>
    <rect x="44" y="28" width="22" height="16" rx="6" fill="#B98251"/>
    <path d="M10 76v80" stroke="#5A5552" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M254 92c8 10 18 22 30 34" fill="none" stroke="#F3EEE4" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>

