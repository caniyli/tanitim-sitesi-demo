<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <title>Filtre kahve</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AEBA9F"/>
      <stop offset="1" stop-color="#8C9A7E"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDBD92"/>
      <stop offset="1" stop-color="#C49C6B"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E3C1E"/>
      <stop offset="1" stop-color="#3A1E0E"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset=".7" stop-color="#EDE6DA"/>
      <stop offset="1" stop-color="#D9CFC0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#wall)"/>
  <path d="M0 330h600" stroke="#7F8C72" stroke-width="2"/>
  <g stroke="#9FAC90" stroke-width="2" opacity=".6">
    <path d="M0 60h600M0 140h600M0 220h600"/>
  </g>

  <!-- tezgâh -->
  <rect y="330" width="600" height="120" fill="url(#counter)"/>
  <rect y="330" width="600" height="8" fill="#B88C5A"/>

  <!-- su ısıtıcısı -->
