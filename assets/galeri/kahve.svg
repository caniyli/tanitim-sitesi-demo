  <ellipse cx="500" cy="356" rx="58" ry="11" fill="#9D7A52" opacity=".5"/>
  <ellipse cx="500" cy="350" rx="58" ry="11" fill="#F6F1E8"/>
  <path d="M458 286h84v36c0 18-18 30-42 30s-42-12-42-30z" fill="#C46A3A"/>
  <path d="M542 298c18 0 22 22 4 28" fill="none" stroke="#C46A3A" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="500" cy="286" rx="42" ry="8" fill="#A9552C"/>
  <ellipse cx="500" cy="287" rx="36" ry="5.5" fill="#4A2612"/>

