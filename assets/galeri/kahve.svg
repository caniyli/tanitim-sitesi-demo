  <g stroke="#8B5A36" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M84 370c4 2 8 2 12 4M108 384c2 3 6 6 9 7M76 393c1 4 3 8 5 10M134 369c4 1 8 1 12 1M124 413c3-2 6-5 8-7M414 403c4 2 8 4 12 5M440 423c4-2 8-4 11-7"/>
