<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <title>Tereyağlı kruvasanlar</title>
  <defs>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1ECE4"/>
      <stop offset="1" stop-color="#DCD3C6"/>
    </linearGradient>
    <radialGradient id="lobe" cx=".4" cy=".3" r=".75">
      <stop offset="0" stop-color="#F6C474"/>
      <stop offset=".55" stop-color="#D48838"/>
      <stop offset="1" stop-color="#9A531E"/>
    </radialGradient>
    <g id="croissant">
      <ellipse cx="2" cy="22" rx="70" ry="14" fill="#2B1608" opacity=".22"/>
      <g fill="url(#lobe)" stroke="#8A4517" stroke-width="1.6">
        <ellipse cx="-60" cy="14" rx="15" ry="8" transform="rotate(-42 -60 14)"/>
        <ellipse cx="60" cy="14" rx="15" ry="8" transform="rotate(42 60 14)"/>
        <ellipse cx="-44" cy="-1" rx="20" ry="13" transform="rotate(-30 -44 -1)"/>
        <ellipse cx="44" cy="-1" rx="20" ry="13" transform="rotate(30 44 -1)"/>
        <ellipse cx="-23" cy="-11" rx="21" ry="18" transform="rotate(-14 -23 -11)"/>
        <ellipse cx="23" cy="-11" rx="21" ry="18" transform="rotate(14 23 -11)"/>
        <ellipse cx="0" cy="-14" rx="19" ry="23"/>
      </g>
      <g fill="#FFE2A8" opacity=".55">
        <ellipse cx="-6" cy="-24" rx="7" ry="9"/>
        <ellipse cx="-28" cy="-19" rx="7" ry="5" transform="rotate(-14 -28 -19)"/>
        <ellipse cx="18" cy="-20" rx="6" ry="4" transform="rotate(14 18 -20)"/>
        <ellipse cx="-48" cy="-6" rx="6" ry="3.5" transform="rotate(-30 -48 -6)"/>
        <ellipse cx="40" cy="-7" rx="5" ry="3" transform="rotate(30 40 -7)"/>
      </g>
    </g>
  </defs>

  <rect width="600" height="450" fill="url(#counter)"/>
  <path d="M-10 90c80 20 120-10 190 30s110 10 160 50M380 -10c20 60 80 70 90 130s70 80 140 90M20 400c60-30 140-10 200-40" fill="none" stroke="#CFC4B5" stroke-width="2" opacity=".7"/>

  <!-- fırın tepsisi -->
  <g transform="rotate(-5 300 225)">
    <rect x="62" y="66" width="476" height="326" rx="10" fill="#4A3A2E" opacity=".22"/>
    <rect x="56" y="54" width="476" height="326" rx="10" fill="#B9B4AD"/>
    <rect x="66" y="64" width="456" height="306" rx="6" fill="#A19B94"/>
    <path d="M66 64h456" stroke="#D3CFC9" stroke-width="3"/>
    <path d="M78 46l450 10-8 330-444-6z" fill="#F3EADA"/>
    <path d="M78 46l450 10" stroke="#E2D4BD" stroke-width="2"/>
    <path d="M160 48l-12 336M310 52l4 334M452 54l-8 332M78 214c140 10 300-8 446 6" fill="none" stroke="#E6DAC6" stroke-width="2"/>

    <use href="#croissant" transform="translate(176 140) scale(.86) rotate(-10)"/>
    <use href="#croissant" transform="translate(306 132) scale(.86) rotate(4)"/>
    <use href="#croissant" transform="translate(434 146) scale(.86) rotate(-4)"/>
    <use href="#croissant" transform="translate(172 288) scale(.86) rotate(6)"/>
    <use href="#croissant" transform="translate(302 298) scale(.86) rotate(-6)"/>
    <use href="#croissant" transform="translate(430 284) scale(.86) rotate(9)"/>
  </g>

  <!-- oklava -->
  <g transform="rotate(-14 520 420)">
    <rect x="430" y="406" width="38" height="14" rx="7" fill="#A97446"/>
    <rect x="462" y="398" width="150" height="30" rx="12" fill="#D2A06C"/>
    <path d="M470 404h134" stroke="#E6BE8A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="#FFFDF7" opacity=".8">
    <circle cx="40" cy="60" r="2"/><circle cx="560" cy="44" r="2.5"/><circle cx="30" cy="420" r="2"/><circle cx="48" cy="400" r="1.5"/>
  </g>
</svg>
