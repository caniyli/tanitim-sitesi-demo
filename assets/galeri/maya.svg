<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <title>Ekşi maya kavanozu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBDDC8"/>
      <stop offset="1" stop-color="#D9C4A6"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EFE3"/>
      <stop offset="1" stop-color="#E9DDCA"/>
    </linearGradient>
    <linearGradient id="starter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EBD3"/>
      <stop offset="1" stop-color="#E8D3AA"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <g stroke="#CDB693" stroke-width="1" opacity=".5">
    <path d="M0 40h600M0 80h600M0 120h600M0 160h600M0 200h600M0 240h600"/>
  </g>

