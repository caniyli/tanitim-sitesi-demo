      <ellipse cx="228" cy="304" rx="8" ry="4" transform="rotate(-25 228 304)"/><ellipse cx="228" cy="316" rx="8" ry="4" transform="rotate(25 228 316)"/>
      <ellipse cx="242" cy="310" rx="9" ry="4.5"/>
      <ellipse cx="196" cy="326" rx="8" ry="4" transform="rotate(10 196 326)"/><ellipse cx="210" cy="330" rx="8" ry="4" transform="rotate(30 210 330)"/>
      <ellipse cx="224" cy="332" rx="8" ry="4" transform="rotate(5 224 332)"/>
      <ellipse cx="196" cy="294" rx="8" ry="4" transform="rotate(-10 196 294)"/><ellipse cx="210" cy="290" rx="8" ry="4" transform="rotate(-30 210 290)"/>
